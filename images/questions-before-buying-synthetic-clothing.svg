<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: Questions Before Buying Synthetic Clothing">
  <defs>
    <linearGradient id="bg-qbsc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-qbsc)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(320,80)">
    <rect x="0" y="0" width="560" height="300" rx="16" fill="white" opacity="0.55" stroke="#c9c0ab" stroke-width="1.5"/>
    <rect x="0" y="0" width="560" height="50" rx="12" fill="#2D4A3E" opacity="0.85"/>
    <text x="280" y="32" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" fill="white" font-weight="bold">Before You Buy Synthetics — Ask:</text>
    <g font-family="Helvetica,sans-serif" font-size="13" fill="#2d3a2d">
      <text x="30" y="82">1. Is it certified (bluesign®, OEKO-TEX®)?</text>
      <text x="30" y="114">2. Does it claim stain or water resistance?</text>
      <text x="30" y="146">3. Will I wear it against bare skin?</text>
      <text x="30" y="178">4. How often will I wash it?</text>
      <text x="30" y="210">5. Is a natural alternative available?</text>
      <text x="30" y="242">6. Have I checked it in Wove?</text>
      <text x="30" y="274">7. Does the brand disclose their chemistry?</text>
    </g>
  </g>
  <text x="600" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Questions Before Buying Synthetic Clothing</text>

</svg>