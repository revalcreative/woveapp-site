<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="PFAS in activewear — leggings and sports bra with performance finish concerns">
  <defs>
    <linearGradient id="aw-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D2A2A"/>
      <stop offset="100%" stop-color="#2A1A1A"/>
    </linearGradient>
    <linearGradient id="aw-card-legging" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5E6A"/>
      <stop offset="100%" stop-color="#6B3F4A"/>
    </linearGradient>
    <linearGradient id="aw-card-bra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8765A"/>
      <stop offset="100%" stop-color="#9A5C42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#aw-card-bg)"/>

  <!-- Subtle texture lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Eyebrow -->
  <text x="100" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="rgba(255,255,255,0.4)">FABRIC SAFETY · ACTIVEWEAR GUIDE</text>

  <!-- Main headline -->
  <text x="100" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" fill="white">PFAS in</text>
  <text x="100" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" fill="white">Activewear</text>

  <!-- Subhead -->
  <text x="100" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">What to know about leggings, sports bras</text>
  <text x="100" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">&amp; workout clothes worn closest to skin.</text>

  <!-- Risk tags -->
  <rect x="100" y="365" width="160" height="28" rx="14" fill="rgba(184,118,90,0.25)" stroke="rgba(184,118,90,0.5)" stroke-width="1"/>
  <text x="180" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#D4956E">Moisture-wicking</text>

  <rect x="270" y="365" width="130" height="28" rx="14" fill="rgba(184,118,90,0.25)" stroke="rgba(184,118,90,0.5)" stroke-width="1"/>
  <text x="335" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#D4956E">Quick-dry</text>

  <rect x="410" y="365" width="130" height="28" rx="14" fill="rgba(184,118,90,0.25)" stroke="rgba(184,118,90,0.5)" stroke-width="1"/>
  <text x="475" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#D4956E">Stay-fresh</text>

  <!-- Leggings illustration (right side) -->
  <g transform="translate(720, 80)">
    <!-- left leg -->
    <path d="M80 0 L30 20 L0 160 L0 380 L60 380 L80 200 Z" fill="url(#aw-card-legging)" opacity="0.9"/>
    <!-- right leg -->
    <path d="M140 0 L190 20 L220 160 L220 380 L160 380 L140 200 Z" fill="url(#aw-card-legging)" opacity="0.9"/>
    <!-- waistband -->
    <rect x="20" y="0" width="180" height="30" rx="8" fill="#5a3040" opacity="0.9"/>
    <!-- center seam -->
    <line x1="110" y1="30" x2="110" y2="380" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- sports bra above -->
    <path d="M40 -80 Q40 -120 110 -120 Q180 -120 180 -80 L180 -50 Q140 -20 110 -20 Q80 -20 40 -50 Z" fill="url(#aw-card-bra)" opacity="0.9"/>
    <!-- bra straps -->
    <line x1="60" y1="-80" x2="70" y2="-140" stroke="#B8765A" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="160" y1="-80" x2="150" y2="-140" stroke="#B8765A" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- question tag on leggings -->
    <line x1="160" y1="120" x2="210" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <rect x="210" y="80" width="56" height="44" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="238" cy="90" r="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <text x="238" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="rgba(255,255,255,0.7)">?</text>
    <!-- sweat dots suggestion -->
    <g fill="rgba(123,169,217,0.5)">
      <circle cx="55" cy="150" r="3"/>
      <circle cx="70" cy="200" r="4"/>
      <circle cx="48" cy="250" r="3"/>
      <circle cx="165" cy="160" r="4"/>
      <circle cx="180" cy="220" r="3"/>
      <circle cx="155" cy="280" r="4"/>
    </g>
  </g>

  <!-- Stat callout -->
  <rect x="100" y="420" width="210" height="68" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="205" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#D4956E">32</text>
  <text x="205" y="468" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">brands tested</text>
  <text x="205" y="482" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">by Mamavation, 2022</text>

  <!-- Wove tag -->
  <rect x="100" y="570" width="100" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="150" y="587" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)">woveapp.com</text>
</svg>
