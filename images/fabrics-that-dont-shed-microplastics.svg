<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: Fabrics That Don't Shed Microplastics">
  <defs>
    <linearGradient id="bg-ftdm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-ftdm)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(370,120)">
    <rect x="0" y="0" width="460" height="240" rx="20" fill="#7a9b6e" opacity="0.25" stroke="#4a6d4a" stroke-width="1.5"/>
    <g font-family="Helvetica,sans-serif" font-size="15" fill="#2d3a2d">
      <rect x="30" y="40" width="180" height="50" rx="10" fill="white" opacity="0.7" stroke="#7a9b6e" stroke-width="1.5"/>
      <text x="120" y="70" text-anchor="middle">100% Linen ✓</text>
      <rect x="30" y="105" width="180" height="50" rx="10" fill="white" opacity="0.7" stroke="#7a9b6e" stroke-width="1.5"/>
      <text x="120" y="135" text-anchor="middle">Organic Cotton ✓</text>
      <rect x="30" y="170" width="180" height="50" rx="10" fill="white" opacity="0.7" stroke="#7a9b6e" stroke-width="1.5"/>
      <text x="120" y="200" text-anchor="middle">Hemp ✓</text>
      <rect x="250" y="40" width="180" height="50" rx="10" fill="#c9c0ab" opacity="0.4" stroke="#c9c0ab" stroke-width="1.5"/>
      <text x="340" y="70" text-anchor="middle">Polyester ✗</text>
      <rect x="250" y="105" width="180" height="50" rx="10" fill="#c9c0ab" opacity="0.4" stroke="#c9c0ab" stroke-width="1.5"/>
      <text x="340" y="135" text-anchor="middle">Acrylic ✗</text>
      <rect x="250" y="170" width="180" height="50" rx="10" fill="#c9c0ab" opacity="0.4" stroke="#c9c0ab" stroke-width="1.5"/>
      <text x="340" y="200" text-anchor="middle">Fleece ✗</text>
    </g>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Natural vs. Synthetic Shedding</text>

</svg>