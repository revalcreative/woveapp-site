<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: How to Read Fiber Content Clothing Labels">
  <defs>
    <linearGradient id="bg-hrfc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-hrfc)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(330,90)">
    <rect x="0" y="0" width="540" height="280" rx="12" fill="white" opacity="0.6" stroke="#c9c0ab" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="46" rx="10" fill="#2D4A3E" opacity="0.9"/>
    <text x="270" y="30" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="14" fill="white" font-weight="bold">CARE LABEL</text>
    <g font-family="Helvetica,sans-serif" font-size="14" fill="#2d3a2d">
      <text x="30" y="80" font-weight="bold">Fiber Content:</text>
      <rect x="30" y="95" width="480" height="36" rx="8" fill="#7a9b6e" opacity="0.35"/>
      <text x="50" y="118">72% Cotton · 20% Polyester · 8% Spandex</text>
      <text x="30" y="162" font-weight="bold">Certifications:</text>
      <rect x="30" y="175" width="225" height="36" rx="8" fill="#7a9b6e" opacity="0.35"/>
      <text x="50" y="198">OEKO-TEX® STANDARD 100</text>
      <text x="30" y="240" font-weight="bold">Country of origin:</text>
      <text x="30" y="262" opacity="0.6">Portugal</text>
    </g>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Reading Fiber Content Clothing Labels</text>

</svg>