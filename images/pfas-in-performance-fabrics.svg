<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: PFAS in Performance Fabrics">
  <defs>
    <linearGradient id="bg-pipf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-pipf)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(310,100)">
    <rect x="0" y="0" width="580" height="260" rx="16" fill="#7a9b6e" opacity="0.15" stroke="#4a6d4a" stroke-width="1.5"/>
    <g font-family="Helvetica,sans-serif" font-size="13">
      <rect x="30" y="30" width="240" height="90" rx="12" fill="#B8765A" opacity="0.25" stroke="#B8765A" stroke-width="1.5"/>
      <text x="150" y="60" text-anchor="middle" fill="#2d3a2d" font-weight="bold">Higher Concern</text>
      <text x="150" y="84">Rain jackets · DWR coatings</text>
      <text x="150" y="104">Ski &amp; outdoor gear</text>
      <rect x="30" y="140" width="240" height="90" rx="12" fill="#4a6d4a" opacity="0.25" stroke="#4a6d4a" stroke-width="1.5"/>
      <text x="150" y="170" text-anchor="middle" fill="#2d3a2d" font-weight="bold">Lower Concern</text>
      <text x="150" y="194">Plain knit activewear</text>
      <text x="150" y="214">Certified synthetics</text>
      <rect x="310" y="30" width="240" height="200" rx="12" fill="white" opacity="0.5" stroke="#c9c0ab" stroke-width="1.5"/>
      <text x="430" y="60" text-anchor="middle" fill="#2D4A3E" font-weight="bold">PFAS Signals</text>
