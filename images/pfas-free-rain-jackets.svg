<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="PFAS-free rain jackets 2026 shopping guide — illustrated rain jacket with water beading off">
  <defs>
    <linearGradient id="rj-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3F5A"/>
      <stop offset="100%" stop-color="#1A2D42"/>
    </linearGradient>
    <linearGradient id="rj-jacket-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#2d5c3f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#rj-bg)"/>

  <!-- Subtle rain line texture -->
  <g stroke="rgba(162,196,220,0.08)" stroke-width="1.5">
    <line x1="80" y1="0" x2="60" y2="630"/>
    <line x1="160" y1="0" x2="140" y2="630"/>
    <line x1="240" y1="0" x2="220" y2="630"/>
    <line x1="320" y1="0" x2="300" y2="630"/>
    <line x1="780" y1="0" x2="760" y2="630"/>
    <line x1="860" y1="0" x2="840" y2="630"/>
    <line x1="940" y1="0" x2="920" y2="630"/>
    <line x1="1020" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Eyebrow -->
  <text x="100" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="rgba(255,255,255,0.4)">NON-TOXIC SHOPPING GUIDE · 2026</text>

  <!-- Main headline -->
  <text x="100" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="white">PFAS-Free</text>
  <text x="100" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" fill="white">Rain Jackets</text>

  <!-- Subhead -->
  <text x="100" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">20+ verified brands from technical alpine shells</text>
  <text x="100" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">to kids' rain gear — curated and fact-checked.</text>

  <!-- Category pills -->
  <rect x="100" y="365" width="105" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="152" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.65)">Technical</text>

  <rect x="215" y="365" width="95" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="262" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.65)">Everyday</text>

  <rect x="320" y="365" width="80" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="360" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.65)">Style</text>

  <rect x="410" y="365" width="65" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="442" y="383" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.65)">Kids</text>

  <!-- Jacket illustration (right side) -->
  <g transform="translate(700, 60)">
    <!-- jacket body -->
    <path d="M190 60 Q140 80 130 140 L140 165 L240 165 L250 140 Q240 80 190 60 Z" fill="url(#rj-jacket-card)" opacity="0.9"/>
    <!-- face/head placeholder -->
    <ellipse cx="190" cy="128" rx="36" ry="42" fill="#d4b896" opacity="0.7"/>
    <!-- hood -->
    <path d="M150 82 Q135 55 148 42 Q168 28 190 32 Q212 28 232 42 Q245 55 230 82 Z" fill="url(#rj-jacket-card)" opacity="0.85"/>
    <!-- body -->
    <path d="M115 165 L90 285 L90 440 L145 440 L145 465 L235 465 L235 440 L290 440 L290 285 L265 165 Z" fill="url(#rj-jacket-card)" opacity="0.9"/>
    <!-- left arm -->
    <path d="M115 165 L60 300 L80 370 L110 320 Z" fill="url(#rj-jacket-card)" opacity="0.85"/>
    <!-- right arm -->
    <path d="M265 165 L320 300 L300 370 L270 320 Z" fill="url(#rj-jacket-card)" opacity="0.85"/>
    <!-- zipper line -->
    <line x1="190" y1="170" x2="190" y2="465" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- water droplets beading off -->
    <g fill="#7bb8dc" opacity="0.9">
      <path d="M105 240 Q98 255 98 263 A9 9 0 0 0 112 263 Q112 255 105 240 Z"/>
      <path d="M140 305 Q134 317 134 324 A8 8 0 0 0 146 324 Q146 317 140 305 Z"/>
      <path d="M168 270 Q162 282 162 289 A8 8 0 0 0 174 289 Q174 282 168 270 Z"/>
      <path d="M218 285 Q212 297 212 304 A8 8 0 0 0 224 304 Q224 297 218 285 Z"/>
      <path d="M248 250 Q242 263 242 271 A9 9 0 0 0 254 271 Q254 263 248 250 Z"/>
      <path d="M272 330 Q266 342 266 349 A8 8 0 0 0 278 349 Q278 342 272 330 Z"/>
      <path d="M122 370 Q116 382 116 389 A8 8 0 0 0 128 389 Q128 382 122 370 Z"/>
      <path d="M258 390 Q252 402 252 409 A8 8 0 0 0 264 409 Q264 402 258 390 Z"/>
    </g>
    <!-- "beading" arcs suggesting DWR -->
    <g stroke="#7bb8dc" stroke-width="1.5" fill="none" opacity="0.45">
      <path d="M88 260 Q80 248 88 236"/>
      <path d="M296 265 Q305 253 296 241"/>
    </g>
  </g>

  <!-- Brand count badge -->
  <rect x="100" y="430" width="190" height="56" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="195" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="400" fill="white">20+</text>
  <text x="195" y="475" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">verified PFAS-free brands</text>

  <!-- Wove tag -->
  <rect x="100" y="570" width="100" height="26" rx="13" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="150" y="587" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.45)">woveapp.com</text>
</svg>
