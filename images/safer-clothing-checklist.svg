<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: Safer Clothing Checklist">
  <defs>
    <linearGradient id="bg-scc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-scc)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(320,80)">
    <rect x="0" y="0" width="560" height="320" rx="16" fill="white" opacity="0.55" stroke="#c9c0ab" stroke-width="1.5"/>
    <rect x="0" y="0" width="560" height="52" rx="12" fill="#2D4A3E" opacity="0.88"/>
    <text x="280" y="34" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="16" fill="white" font-weight="bold">Safer Clothing Checklist</text>
    <g font-family="Helvetica,sans-serif" font-size="13.5" fill="#2d3a2d">
      <rect x="28" y="74" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="93">Natural or certified fiber content</text>
      <rect x="28" y="116" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="135">OEKO-TEX® or GOTS certified</text>
      <rect x="28" y="158" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="177">No PFAS or stain-resistant finish</text>
      <rect x="28" y="200" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="219">No antimicrobial or odor treatments</text>
      <rect x="28" y="242" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="261">Brand discloses chemistry</text>
      <rect x="28" y="284" width="26" height="26" rx="6" fill="#7a9b6e" stroke="#2D4A3E" stroke-width="1.5"/>
      <text x="65" y="303">Verified with Wove app</text>
    </g>
  </g>
  <text x="600" y="455" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Your Safer Clothing Checklist</text>

