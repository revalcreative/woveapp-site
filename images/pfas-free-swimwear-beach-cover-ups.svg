      <line x1="0" y1="90" x2="120" y2="55" stroke="#2D4A3E" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="140" x2="120" y2="105" stroke="#2D4A3E" stroke-width="1" opacity="0.4"/>
