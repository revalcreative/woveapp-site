    <text x="90" y="130" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#2d3a2d" opacity="0.7">Linen / Cotton</text>
    <text x="120" y="290" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="13" fill="#2d3a2d">Mid · Outer Layers</text>
    <g font-family="Helvetica,sans-serif" font-size="13" fill="#2d3a2d">
      <text x="330" y="120">Base: Linen</text>
      <text x="330" y="150">Mid: Cotton knit</text>
      <text x="330" y="180">Outer: Certified</text>
      <text x="330" y="205">  wool or hemp</text>
