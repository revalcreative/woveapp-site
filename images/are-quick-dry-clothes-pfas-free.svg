<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: Are Quick-Dry Clothes PFAS-Free">
  <defs>
    <linearGradient id="bg-aqcp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-aqcp)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(360,100)">
    <rect x="80" y="0" width="320" height="240" rx="16" fill="#4a6d4a" opacity="0.75" stroke="#2D4A3E" stroke-width="2"/>
    <!-- water drops -->
    <g fill="#B8765A" opacity="0.75">
      <ellipse cx="180" cy="80" rx="18" ry="24"/>
      <ellipse cx="260" cy="60" rx="14" ry="18"/>
      <ellipse cx="320" cy="90" rx="16" ry="22"/>
      <ellipse cx="220" cy="110" rx="12" ry="16"/>
    </g>
    <!-- PFAS question mark -->
    <text x="200" y="200" font-family="Helvetica,sans-serif" font-size="60" fill="white" opacity="0.3" font-weight="bold">?</text>
    <text x="80" y="268" font-family="Helvetica,sans-serif" font-size="14" fill="#2d3a2d">Quick-Dry Performance</text>
    <!-- arrow to chemical structure -->
    <line x1="420" y1="120" x2="500" y2="120" stroke="#c9c0ab" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(500,80)">
      <circle cx="50" cy="40" r="20" fill="none" stroke="#c9c0ab" stroke-width="2"/>
      <text x="50" y="46" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#c9c0ab">PFAS?</text>
      <line x1="70" y1="40" x2="100" y2="40" stroke="#c9c0ab" stroke-width="2"/>
      <circle cx="115" cy="40" r="15" fill="none" stroke="#c9c0ab" stroke-width="2"/>
    </g>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Quick-Dry Clothes &amp; PFAS</text>

</svg>