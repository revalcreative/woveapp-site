<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: PFAS Clothing Laws by State">
  <defs>
    <linearGradient id="bg-pclbs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-pclbs)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <rect x="340" y="120" width="520" height="280" rx="16" fill="white" opacity="0.6" stroke="#c9c0ab" stroke-width="1.5"/>
  <rect x="340" y="120" width="520" height="50" rx="12" fill="#2D4A3E" opacity="0.9"/>
  <text x="600" y="152" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="15" fill="white" font-weight="bold">PFAS Clothing Laws by State</text>
  <g font-family="Helvetica,sans-serif" font-size="13" fill="#2d3a2d">
    <circle cx="380" cy="205" r="8" fill="#7a9b6e"/>
    <text x="400" y="210">California — Banned 2025</text>
    <circle cx="380" cy="235" r="8" fill="#7a9b6e"/>
    <text x="400" y="240">New York — Banned 2023</text>
    <circle cx="380" cy="265" r="8" fill="#4a6d4a"/>
    <text x="400" y="270">Maine — In progress</text>
    <circle cx="380" cy="295" r="8" fill="#4a6d4a"/>
    <text x="400" y="300">Vermont — In progress</text>
    <circle cx="380" cy="325" r="8" fill="#c9c0ab"/>
    <text x="400" y="330">Most states — No law yet</text>
    <circle cx="380" cy="355" r="8" fill="#B8765A" opacity="0.7"/>
    <text x="400" y="360">Federal — Proposed</text>
  </g>
  <text x="600" y="445" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2d3a2d" opacity="0.55">State-by-state PFAS clothing legislation</text>

</svg>