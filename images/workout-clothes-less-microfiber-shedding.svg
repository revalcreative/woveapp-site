<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Hero illustration for: Workout Clothes That Shed Fewer Microfibers">
  <defs>
    <linearGradient id="bg-wclm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6e1d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg-wclm)" rx="12"/>
  <!-- corner hex motifs -->
  <g stroke="#c9c0ab" stroke-width="1.5" fill="none" opacity="0.45">
    <polygon points="80,60 108,44 136,60 136,92 108,108 80,92"/>
    <line x1="136" y1="76" x2="168" y2="76"/>
    <circle cx="178" cy="76" r="8"/>
    <polygon points="1064,428 1092,412 1120,428 1120,460 1092,476 1064,460"/>
    <line x1="1120" y1="444" x2="1152" y2="444"/>
    <circle cx="1162" cy="444" r="8"/>
    <polygon points="1090,55 1112,43 1134,55 1134,79 1112,91 1090,79"/>
    <polygon points="66,420 88,408 110,420 110,444 88,456 66,444"/>
  </g>

  <g transform="translate(350,110)">
    <rect x="80" y="0" width="110" height="220" rx="20" fill="#2D4A3E" stroke="#4a6d4a" stroke-width="2"/>
    <rect x="80" y="0" width="110" height="40" rx="10" fill="#2D4A3E" stroke="#4a6d4a" stroke-width="2"/>
    <line x1="135" y1="0" x2="135" y2="220" stroke="#4a6d4a" stroke-width="1.5" opacity="0.5"/>
    <text x="135" y="248" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#2d3a2d">Tighter weave</text>
    <rect x="230" y="30" width="240" height="160" rx="16" fill="#7a9b6e" opacity="0.3" stroke="#4a6d4a" stroke-width="1.5"/>
    <g font-family="Helvetica,sans-serif" font-size="13" fill="#2d3a2d">
      <text x="350" y="80">↓ Fewer microfibers</text>
      <text x="350" y="110">↓ Tighter construction</text>
      <text x="350" y="140">↓ Longer fiber length</text>
      <text x="350" y="170">↓ Less pill &amp; fuzz</text>
    </g>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2d3a2d" opacity="0.6">Choosing Lower-Shedding Workout Clothes</text>

